name: Build and Push Runner Image
run-name: Build runner image from ${{ inputs.branch_tag_name || github.ref_name }}

on:
  push:
    branches: ["*"]
    tags: ["*"]
  schedule:
    # Rebuild weekly so the base image and OS packages get refreshed even when
    # nothing in this repo changes.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      branch_tag_name:
        description: "Branch (or tag) to build from"
        default: develop
        required: true
        type: string
      kubectl_version:
        description: "kubectl version to bake in, no leading v (e.g. 1.36.0). Blank uses the Dockerfile default."
        required: false
        type: string
      helm_version:
        description: "Helm version to bake in, no leading v (e.g. 3.21.3). Blank uses the Dockerfile default."
        required: false
        type: string
      yq_version:
        description: "yq version to bake in, no leading v (e.g. 4.53.6). Blank uses the Dockerfile default."
        required: false
        type: string
      stern_version:
        description: "stern version to bake in, no leading v (e.g. 1.34.0). Blank uses the Dockerfile default."
        required: false
        type: string
  repository_dispatch:
    # Triggered by the infrastructure repo (opencrvs/infrastructure) when it
    # bumps kubernetes_version/helm_version in group_vars/all.yml, e.g.:
    #   gh api repos/opencrvs/github-opencrvs-self-hosted-runner/dispatches \
    #     -f event_type=rebuild \
    #     -F 'client_payload[branch_tag_name]=main' \
    #     -F 'client_payload[kubectl_version]=1.36.0' \
    #     -F 'client_payload[helm_version]=3.21.3' \
    #     -F 'client_payload[yq_version]=4.53.6' \
    #     -F 'client_payload[stern_version]=1.34.0'
    types: [rebuild]

jobs:
  build-and-push:
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
    env:
      image_path: ghcr.io/opencrvs/opencrvs-github-runner
      kubectl_version: ${{ inputs.kubectl_version || github.event.client_payload.kubectl_version }}
      helm_version: ${{ inputs.helm_version || github.event.client_payload.helm_version }}
      yq_version: ${{ inputs.yq_version || github.event.client_payload.yq_version }}
      stern_version: ${{ inputs.stern_version || github.event.client_payload.stern_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch_tag_name || github.event.client_payload.branch_tag_name || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Determine image tags
        id: tags
        env:
          BRANCH: ${{ inputs.branch_tag_name || github.event.client_payload.branch_tag_name || github.ref_name }}
        run: |
          VERSION=$(git rev-parse HEAD | cut -c1-7)
          echo "Pushing version $VERSION"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          ESCAPED_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9_.-]/-/g')
          echo "from branch $ESCAPED_BRANCH"
          echo "branch=${ESCAPED_BRANCH}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          BUILD_ARGS=()
          [[ -n "${kubectl_version}" ]] && BUILD_ARGS+=(--build-arg "KUBECTL_VERSION=${kubectl_version}")
          [[ -n "${helm_version}" ]] && BUILD_ARGS+=(--build-arg "HELM_VERSION=${helm_version}")
          [[ -n "${yq_version}" ]] && BUILD_ARGS+=(--build-arg "YQ_VERSION=${yq_version}")
          [[ -n "${stern_version}" ]] && BUILD_ARGS+=(--build-arg "STERN_VERSION=${stern_version}")
          docker build "${BUILD_ARGS[@]}" \
            -t ${{ env.image_path }}:${{ steps.tags.outputs.version }} \
            -t ${{ env.image_path }}:${{ steps.tags.outputs.branch }} \
            -f Dockerfile .

      - name: Write workflow summary
        run: |
          IMG="${{ env.image_path }}:${{ steps.tags.outputs.version }}"

          KUBECTL_V=$(docker run --rm --entrypoint kubectl "$IMG" version --client 2>/dev/null | head -1)
          HELM_V=$(docker run --rm --entrypoint helm "$IMG" version --short 2>/dev/null)
          YQ_V=$(docker run --rm --entrypoint yq "$IMG" --version 2>/dev/null)
          STERN_V=$(docker run --rm --entrypoint stern "$IMG" --version 2>/dev/null | head -1)

          {
            echo "## Runner image versions"
            echo ""
            echo "Image: \`$IMG\` (also tagged \`${{ steps.tags.outputs.branch }}\` and \`latest\`)"
            echo ""
            echo "| Tool | Version |"
            echo "|---|---|"
            echo "| kubectl | \`${KUBECTL_V}\` |"
            echo "| helm | \`${HELM_V}\` |"
            echo "| yq | \`${YQ_V}\` |"
            echo "| stern | \`${STERN_V}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push Docker image
        run: |
          docker push ${{ env.image_path }}:${{ steps.tags.outputs.version }}
          docker push ${{ env.image_path }}:${{ steps.tags.outputs.branch }}
          docker tag ${{ env.image_path }}:${{ steps.tags.outputs.version }} ${{ env.image_path }}:latest
          docker push ${{ env.image_path }}:latest
